[project]
name = "sen12ms-cr-ts"
version = "0.1.0"
description = "SEN12MS-CR-TS reference code (CR-TS Net), fork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
scripts = [
    "dominate>=2.9.1",  # util/html.py, imported by test.py and util/visualizer.py
    "matplotlib>=3.11.2",
    "natsort>=8.4.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "rasterio>=1.5.1",
    "s2cloudless>=1.7.3",  # data/dataLoader.py computes cloud masks on the fly
    "scipy>=1.18.1",
    "tifffile>=2026.9.20",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

# The CR-TS Net generator is a package (src/crtsnet/, symlinks to models/) that other projects
# depend on; a library does not pin a torch build, so torch comes from PyPI unless the
# application that installs it pins one.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crtsnet"]

[tool.uv]
default-groups = ["dev", "scripts"]  # `uv sync` here still installs what the scripts need

[tool.ruff]
# Upstream code keeps its own style (src/crtsnet/ links to it).
extend-exclude = ["data", "models", "options", "src", "util", "preview", "train.py", "test.py", "standalone_dataloader.py", "README.md"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
